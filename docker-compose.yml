version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: vezilka-postgres
    restart: always
    environment:
      POSTGRES_DB: vezilka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    image: node:24-slim
    container_name: vezilka-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
